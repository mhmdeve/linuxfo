[workspace]
resolver = "2"
members = ["crates/linuxfo-core", "crates/linuxfo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Muhammad Hamza Mushtaq <mhmdeveloperofficial@gmail.com>"]
repository = "https://github.com/mhmdeve/linuxfo"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
glib = "0.20"
