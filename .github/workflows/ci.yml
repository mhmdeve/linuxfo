name: LinuxFo CI

on:
  push:
    branches: [main, gpt]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Core tests
        run: cargo test -p linuxfo-core
      - name: Lint core
        run: cargo clippy -p linuxfo-core --all-targets -- -D warnings
      - name: Build desktop application
        run: cargo build --release -p linuxfo
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: linuxfo-${{ matrix.arch }}
          path: target/release/linuxfo
          if-no-files-found: error
