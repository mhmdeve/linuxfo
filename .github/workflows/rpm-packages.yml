name: LinuxFo RPM packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Fedora RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM in Fedora container
        run: |
          docker run --rm --platform linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }} -v "$PWD:/src" -w /src fedora:42 bash -lc '
            dnf install -y gcc gcc-c++ make pkgconf-pkg-config gtk4-devel libadwaita-devel curl rpm-build
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source /root/.cargo/env
            cargo build --release -p linuxfo
            mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            cat > /root/rpmbuild/SPECS/linuxfo.spec <<EOF
Name: linuxfo
Version: 0.2.0
Release: 1%{?dist}
Summary: Linux system information and hardware monitor
License: MIT
Requires: gtk4, libadwaita, smartmontools
BuildArch: %{_arch}
%description
LinuxFo hardware and system information desktop application.
%install
mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/lib/systemd/system
install -m 0755 /src/target/release/linuxfo %{buildroot}/usr/bin/linuxfo
install -m 0755 /src/target/release/linuxfo-daemon %{buildroot}/usr/bin/linuxfo-daemon
install -m 0644 /src/packaging/linuxfo-daemon.service %{buildroot}/usr/lib/systemd/system/linuxfo-daemon.service
%post
if command -v systemctl >/dev/null 2>&1; then systemctl daemon-reload || :; systemctl enable --now linuxfo-daemon.service || :; fi
%preun
if [ "$1" -eq 0 ] && command -v systemctl >/dev/null 2>&1; then systemctl disable --now linuxfo-daemon.service || :; fi
%postun
if command -v systemctl >/dev/null 2>&1; then systemctl daemon-reload || :; fi
%files
/usr/bin/linuxfo
/usr/bin/linuxfo-daemon
/usr/lib/systemd/system/linuxfo-daemon.service
EOF
            rpmbuild -bb /root/rpmbuild/SPECS/linuxfo.spec
            mkdir -p /src/rpm-out
            cp /root/rpmbuild/RPMS/*/*.rpm /src/rpm-out/
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: rpm-out/*.rpm
