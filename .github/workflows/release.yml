name: LinuxFo Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p linuxfo --bins
      - name: Build Debian package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "linuxfo"))')"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          PKG="linuxfo_${VERSION}_${{ matrix.deb_arch }}"
          ROOT="pkg/$PKG"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/lib/systemd/system" "$ROOT/usr/share/applications" "$ROOT/usr/share/doc/linuxfo" "$ROOT/usr/share/icons/hicolor/scalable/apps"
          for size in 48 64 128 256 512; do
            mkdir -p "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/io.linuxfo.SystemInfo.svg > "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/io.linuxfo.SystemInfo.png"
          done
          test -x target/release/linuxfo-daemon
          install -m 0755 target/release/linuxfo "$ROOT/usr/bin/linuxfo"
          install -m 0755 target/release/linuxfo-daemon "$ROOT/usr/bin/linuxfo-daemon"
          install -m 0644 packaging/linuxfo-daemon.service "$ROOT/usr/lib/systemd/system/linuxfo-daemon.service"
          install -m 0644 packaging/io.linuxfo.SystemInfo.desktop "$ROOT/usr/share/applications/io.linuxfo.SystemInfo.desktop"
          install -m 0644 packaging/io.linuxfo.SystemInfo.svg "$ROOT/usr/share/icons/hicolor/scalable/apps/io.linuxfo.SystemInfo.svg"
          install -m 0644 README.md LICENSE "$ROOT/usr/share/doc/linuxfo/"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: linuxfo
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libgtk-4-1, libadwaita-1-0, smartmontools
          Maintainer: Muhammad Hamza Mushtaq <mhmdeveloperofficial@gmail.com>
          Homepage: https://github.com/mhmdeve/linuxfo
          Description: Linux system information and hardware monitor
           GTK4 desktop application for Linux hardware and sensor information.
          EOF
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            systemctl enable --now linuxfo-daemon.service || true
          fi
          exit 0
          EOF
          cat > "$ROOT/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl disable --now linuxfo-daemon.service || true
          fi
          exit 0
          EOF
          cat > "$ROOT/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
          fi
          exit 0
          EOF
          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm" "$ROOT/DEBIAN/postrm"
          dpkg-deb --root-owner-group --build "$ROOT"
          dpkg-deb --contents "$ROOT.deb" | grep -E 'usr/bin/linuxfo-daemon|linuxfo-daemon.service'
          mv "$ROOT.deb" "linuxfo_${VERSION}_${{ matrix.deb_arch }}.deb"
      - name: Bundle release archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "linuxfo"))')"
          fi
          ARCHIVE="linuxfo-v${VERSION}-${{ matrix.arch }}"
          mkdir -p "bundle/$ARCHIVE"
          install -m 0755 target/release/linuxfo "bundle/$ARCHIVE/linuxfo"
          install -m 0644 README.md LICENSE "bundle/$ARCHIVE/"
          install -m 0644 packaging/io.linuxfo.SystemInfo.desktop "bundle/$ARCHIVE/"
          tar -C bundle -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            linuxfo-*.tar.gz
            linuxfo-*.sha256
            linuxfo_*.deb
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # gh release create needs a checked-out Git repository to resolve the
      # repository and tag context in the publish job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "linuxfo"))')"
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "LinuxFo v${RELEASE_VERSION}"
          else
            gh release create "$RELEASE_TAG" release-assets/* --title "LinuxFo v${RELEASE_VERSION}" --generate-notes
          fi
