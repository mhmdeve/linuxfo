name: LinuxFo Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p linuxfo
      - name: Bundle release archive
        shell: bash
        run: |
          mkdir -p "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}"
          install -m 0755 target/release/linuxfo "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}/linuxfo"
          install -m 0644 README.md LICENSE "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}/"
          install -m 0644 packaging/linuxfo.desktop "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}/"
          tar -C bundle -czf "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}"
          sha256sum "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" > "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            linuxfo-*.tar.gz
            linuxfo-*.sha256
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "LinuxFo ${GITHUB_REF_NAME}" --generate-notes
