name: LinuxFo Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p linuxfo
      - name: Build Debian package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="linuxfo_${VERSION}_${{ matrix.deb_arch }}"
          ROOT="pkg/$PKG"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications" "$ROOT/usr/share/doc/linuxfo"
          for size in 48 64 128 256 512; do
            mkdir -p "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/io.linuxfo.SystemInfo.svg > "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/io.linuxfo.SystemInfo.png"
          done
          install -m 0755 target/release/linuxfo "$ROOT/usr/bin/linuxfo"
          install -m 0644 packaging/io.linuxfo.SystemInfo.desktop "$ROOT/usr/share/applications/io.linuxfo.SystemInfo.desktop"
          install -m 0644 README.md LICENSE "$ROOT/usr/share/doc/linuxfo/"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: linuxfo
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libgtk-4-1, libadwaita-1-0
          Maintainer: Muhammad Hamza Mushtaq <mhmdeveloperofficial@gmail.com>
          Homepage: https://github.com/mhmdeve/linuxfo
          Description: Linux system information and hardware monitor
           GTK4 desktop application for Linux hardware and sensor information.
          EOF
          dpkg-deb --root-owner-group --build "$ROOT"
          mv "$ROOT.deb" "linuxfo_${VERSION}_${{ matrix.deb_arch }}.deb"
      - name: Bundle release archive
        shell: bash
        run: |
          mkdir -p "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}"
          install -m 0755 target/release/linuxfo "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}/linuxfo"
          install -m 0644 README.md LICENSE "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}/"
          install -m 0644 packaging/io.linuxfo.SystemInfo.desktop "bundle/linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}/"
          tar -C bundle -czf "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}"
          sha256sum "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz" > "linuxfo-${GITHUB_REF_NAME}-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            linuxfo-*.tar.gz
            linuxfo-*.sha256
            linuxfo_*.deb
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --title "LinuxFo ${GITHUB_REF_NAME}" --generate-notes
