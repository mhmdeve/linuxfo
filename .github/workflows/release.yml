name: LinuxFo Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linuxfo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-bin dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "linuxfo"))')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" != v* ]]; then
              echo "Release tags must use the vX.Y.Z format." >&2
              exit 1
            fi
            if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
              echo "Tag version ($VERSION) does not match Cargo version ($CARGO_VERSION)." >&2
              exit 1
            fi
          else
            VERSION="$CARGO_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build application and privileged daemon
        run: cargo build --locked --release -p linuxfo --bins

      - name: Verify release binaries
        run: |
          test -x target/release/linuxfo
          test -x target/release/linuxfo-daemon

      - name: Assemble Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="linuxfo_${VERSION}_${DEB_ARCH}"
          ROOT="pkg/$PKG"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/lib/systemd/system" \
            "$ROOT/usr/share/applications" "$ROOT/usr/share/doc/linuxfo" \
            "$ROOT/usr/share/icons/hicolor/scalable/apps"

          for size in 48 64 128 256 512; do
            mkdir -p "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/io.linuxfo.SystemInfo.svg \
              > "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/io.linuxfo.SystemInfo.png"
          done

          install -m 0755 target/release/linuxfo "$ROOT/usr/bin/linuxfo"
          install -m 0755 target/release/linuxfo-daemon "$ROOT/usr/bin/linuxfo-daemon"
          install -m 0644 packaging/linuxfo-daemon.service "$ROOT/usr/lib/systemd/system/linuxfo-daemon.service"
          install -m 0644 packaging/io.linuxfo.SystemInfo.desktop "$ROOT/usr/share/applications/io.linuxfo.SystemInfo.desktop"
          install -m 0644 packaging/io.linuxfo.SystemInfo.svg "$ROOT/usr/share/icons/hicolor/scalable/apps/io.linuxfo.SystemInfo.svg"
          install -m 0644 README.md LICENSE "$ROOT/usr/share/doc/linuxfo/"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: linuxfo
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: $DEB_ARCH
          Depends: libgtk-4-1, libadwaita-1-0, smartmontools
          Maintainer: Muhammad Hamza Mushtaq <mhmdeveloperofficial@gmail.com>
          Homepage: https://github.com/mhmdeve/linuxfo
          Description: Linux system information and hardware monitor
           GTK4 desktop application for Linux hardware and sensor information.
          EOF

          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            systemctl enable --now linuxfo-daemon.service || true
          fi
          exit 0
          EOF
          cat > "$ROOT/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl disable --now linuxfo-daemon.service || true
          fi
          exit 0
          EOF
          cat > "$ROOT/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
          fi
          exit 0
          EOF
          chmod 0755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm" "$ROOT/DEBIAN/postrm"
          dpkg-deb --root-owner-group --build "$ROOT"
          PACKAGE="linuxfo_${VERSION}_${DEB_ARCH}.deb"
          mv "$ROOT.deb" "$PACKAGE"
          dpkg-deb --info "$PACKAGE"
          dpkg-deb --contents "$PACKAGE" | grep -q 'usr/bin/linuxfo-daemon'
          dpkg-deb --contents "$PACKAGE" | grep -q 'linuxfo-daemon.service'

      - name: Bundle portable archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          NAME="linuxfo-v${VERSION}-${ARCH}"
          mkdir -p "bundle/$NAME"
          install -m 0755 target/release/linuxfo "bundle/$NAME/linuxfo"
          install -m 0644 README.md LICENSE packaging/io.linuxfo.SystemInfo.desktop "bundle/$NAME/"
          tar -C bundle -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            linuxfo-*.tar.gz
            linuxfo-*.sha256
            linuxfo_*.deb

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Verify complete release asset set
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "linuxfo"))')"
            TAG="v$VERSION"
          fi
          VERSION="${TAG#v}"
          for file in \
            "linuxfo_${VERSION}_amd64.deb" \
            "linuxfo_${VERSION}_arm64.deb" \
            "linuxfo-v${VERSION}-x86_64.tar.gz" \
            "linuxfo-v${VERSION}-aarch64.tar.gz"; do
            test -s "release-assets/$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "LinuxFo v$RELEASE_VERSION"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "LinuxFo v$RELEASE_VERSION" --generate-notes
          fi
