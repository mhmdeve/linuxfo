name: Publish LinuxFo APT repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: linuxfo-apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

      - name: Download and validate release packages
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.2.0; got '$TAG'." >&2
            exit 1
          fi

          mkdir -p site/pool/main
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'linuxfo_*_amd64.deb' \
            --pattern 'linuxfo_*_arm64.deb' \
            --dir site/pool/main

          mapfile -t DEBS < <(find site/pool/main -maxdepth 1 -type f -name '*.deb' -print)
          if [[ "${#DEBS[@]}" -ne 2 ]]; then
            echo "Expected exactly two Debian packages (amd64 and arm64); found ${#DEBS[@]}." >&2
            printf '%s\n' "${DEBS[@]}"
            exit 1
          fi
          dpkg-deb --field site/pool/main/linuxfo_*_amd64.deb Architecture | grep -qx amd64
          dpkg-deb --field site/pool/main/linuxfo_*_arm64.deb Architecture | grep -qx arm64
          dpkg-deb --field site/pool/main/linuxfo_*_amd64.deb Version
          dpkg-deb --field site/pool/main/linuxfo_*_arm64.deb Version

      - name: Generate signed APT metadata
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "Missing required Actions secret: APT_GPG_PRIVATE_KEY." >&2
            exit 1
          fi

          export GNUPGHOME="$RUNNER_TEMP/linuxfo-apt-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')"
          if [[ -z "$FPR" ]]; then
            echo "The configured APT_GPG_PRIVATE_KEY contains no usable secret key." >&2
            exit 1
          fi

          mkdir -p site/dists/stable/main/binary-amd64 site/dists/stable/main/binary-arm64
          (cd site && dpkg-scanpackages --arch amd64 pool/main /dev/null > dists/stable/main/binary-amd64/Packages)
          (cd site && dpkg-scanpackages --arch arm64 pool/main /dev/null > dists/stable/main/binary-arm64/Packages)
          gzip -9fk site/dists/stable/main/binary-amd64/Packages
          gzip -9fk site/dists/stable/main/binary-arm64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="LinuxFo" \
            -o APT::FTPArchive::Release::Label="LinuxFo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            release site/dists/stable > site/dists/stable/Release

          GPG_ARGS=(--batch --yes --local-user "$FPR")
          if [[ -n "${APT_GPG_PASSPHRASE:-}" ]]; then
            printf '%s' "$APT_GPG_PASSPHRASE" > "$RUNNER_TEMP/apt-gpg-passphrase"
            chmod 600 "$RUNNER_TEMP/apt-gpg-passphrase"
            GPG_ARGS+=(--pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/apt-gpg-passphrase")
          fi
          gpg "${GPG_ARGS[@]}" --clearsign \
            --output site/dists/stable/InRelease site/dists/stable/Release
          gpg "${GPG_ARGS[@]}" --detach-sign --armor \
            --output site/dists/stable/Release.gpg site/dists/stable/Release
          gpg --batch --armor --export "$FPR" > site/linuxfo-archive-keyring.asc

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>LinuxFo APT repository</title></head>
          <body><h1>LinuxFo APT repository</h1>
          <p>Signed Debian packages for amd64 and arm64.</p>
          <p><a href="https://github.com/mhmdeve/linuxfo">LinuxFo project on GitHub</a></p>
          </body></html>
          EOF
          touch site/.nojekyll
          gpg --verify site/dists/stable/Release.gpg site/dists/stable/Release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
