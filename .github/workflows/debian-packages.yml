name: LinuxFo Debian packages

on:
  workflow_dispatch:
  push:
    branches: [gpt]
    tags: ['v*']

permissions:
  contents: read

jobs:
  deb:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev dpkg-dev librsvg2-bin
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build LinuxFo
        run: cargo build --release -p linuxfo
      - name: Assemble Debian package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.2.0"; fi
          PKG="linuxfo_${VERSION}_${{ matrix.arch }}"
          ROOT="pkg/$PKG"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/applications" "$ROOT/usr/share/doc/linuxfo" "$ROOT/usr/share/icons/hicolor/scalable/apps"
          for size in 48 64 128 256 512; do
            mkdir -p "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
            rsvg-convert -w "$size" -h "$size" packaging/io.linuxfo.SystemInfo.svg > "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/io.linuxfo.SystemInfo.png"
          done
          install -m 0755 target/release/linuxfo "$ROOT/usr/bin/linuxfo"
          install -m 0644 packaging/io.linuxfo.SystemInfo.desktop "$ROOT/usr/share/applications/io.linuxfo.SystemInfo.desktop"
          install -m 0644 packaging/io.linuxfo.SystemInfo.svg "$ROOT/usr/share/icons/hicolor/scalable/apps/io.linuxfo.SystemInfo.svg"
          install -m 0644 README.md LICENSE "$ROOT/usr/share/doc/linuxfo/"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: linuxfo
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Depends: libgtk-4-1, libadwaita-1-0, smartmontools
          Maintainer: Muhammad Hamza Mushtaq <mhmdeveloperofficial@gmail.com>
          Homepage: https://github.com/mhmdeve/linuxfo
          Description: Linux system information and hardware monitor
           A GTK4 desktop application for inspecting Linux hardware, sensors,
           memory, storage, cameras, network interfaces and connected devices.
          EOF
          dpkg-deb --root-owner-group --build "$ROOT"
          mv "$ROOT.deb" "linuxfo_${VERSION}_${{ matrix.arch }}.deb"
          dpkg-deb --info "linuxfo_${VERSION}_${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: linuxfo_*.deb
          if-no-files-found: error
