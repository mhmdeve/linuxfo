name: LinuxFo Debian packages (legacy)

on:
  workflow_dispatch:
    inputs:
      note:
        description: This workflow is retained for compatibility. Use the LinuxFo Release workflow for official packages.
        required: false
        type: string

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Direct maintainers to the unified release workflow
        run: |
          echo "::notice::Official Debian packages are built and attached by .github/workflows/release.yml."
          echo "Run the LinuxFo Release workflow or push a matching vX.Y.Z tag."
